name: Configurar base de datos

on:
  workflow_dispatch:

jobs:
  setup-database:
    name: Liquibase y carga de datos
    runs-on: ubuntu-latest

    env:
      DB_HOST: ${{ secrets.HOST }}
      DB_NAME: ${{ secrets.DATABASE }}
      DB_USER: ${{ secrets.USUARIO }}
      DB_PASSWORD: ${{ secrets.PASSWORD }}
      PGSSLMODE: require

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Liquibase
        run: |
          wget -q https://github.com/liquibase/liquibase/releases/download/v4.31.1/liquibase-4.31.1.tar.gz
          mkdir liquibase-bin
          tar -xzf liquibase-4.31.1.tar.gz -C liquibase-bin

      - name: Ejecutar Liquibase
        run: |
          ./liquibase-bin/liquibase \
            --url="jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}?sslmode=require" \
            --username="${DB_USER}" \
            --password="${DB_PASSWORD}" \
            --changelog-file="liquibase/changelog.xml" \
            update

      - name: Instalar PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Cargar CSV
        env:
          PGPASSWORD: ${{ secrets.PASSWORD }}
        run: |
          psql \
            -h "$DB_HOST" \
            -p 5432 \
            -U "$DB_USER" \
            -d "$DB_NAME" \
            -v ON_ERROR_STOP=1 \
            -f database/load_data.sql

      - name: Verificar registros
        env:
          PGPASSWORD: ${{ secrets.PASSWORD }}
        run: |
          psql \
            -h "$DB_HOST" \
            -p 5432 \
            -U "$DB_USER" \
            -d "$DB_NAME" \
            -c "SELECT COUNT(*) AS total_registros FROM autorizaciones_radiodifusion;"